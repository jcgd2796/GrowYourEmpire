{% load static %}
<!DOCTYPE html>
<html>

<head>
	<title>Grow Your Empire - Login</title>
	<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="{% static 'css/materialize.min.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
	<div class="container">
		<div class="card col s12 m6 offset-m3 l4 offset-l4 blue lighten-4">
			<div class="card-content">
				<span class="row card-title center-align">
					<h5>Iniciar Sesión</h5>
				</span>
				<form action='/GrowYourEmpire/login' method="POST">
					{% csrf_token %}
					{% if msg %}
					<p class="center-align black-text">{{msg}}</p>
					{% endif %}	
					<div class="row">
						<h6><i class="material-icons prefix">person</i>Usuario</h6>
						<input id="User" type="text" name="user" class="validate" required />
					</div>
					<div class="row">
						<h6><i class="material-icons prefix">lock</i>Contraseña<h6>
						<input id="pass" type="password" name="password" class="validate" required />
					</div>
					<div class="row center-align">
						<button class="btn waves-effect waves-light blue darken-2" type="submit" name="login">
							<i class="material-icons left">login</i>
							Iniciar sesión
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
<script src="{% static 'js/materialize.min.js' %}"></script>
<script src="{% static 'js/init-materialize.js' %}"></script>
</body>
</html>
